{# expects: s (SectionView) #}
<div class="rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4">
  <div class="flex items-start justify-between gap-3">
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <span class="font-mono text-sm font-medium truncate">[{{ s.name }}]</span>
        {% if s.has_file %}
        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">file present</span>
        {% else %}
        <span class="inline-flex items-center rounded-full px-2 py-0.5 text-xs bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300" title="expected {{ s.name }}.gguf in models dir">no matching GGUF</span>
        {% endif %}
      </div>
      {% if s.items %}
      <div class="mt-2 flex flex-wrap gap-1.5">
        {% for k, v in s.items %}
        <span class="inline-flex items-center gap-1 rounded bg-slate-100 dark:bg-slate-800 px-2 py-0.5 text-xs font-mono">
          <span class="text-slate-500 dark:text-slate-400">{{ k }}</span>
          <span>=</span>
          <span>{{ v }}</span>
        </span>
        {% endfor %}
      </div>
      {% else %}
      <div class="mt-2 text-xs text-slate-500 dark:text-slate-400">(no options — all defaults)</div>
      {% endif %}
    </div>
    {% from "_icons.html" import icon %}
    <div class="flex items-center gap-2 shrink-0"
         x-data="{ copied: false }">
      <button type="button"
              @click="navigator.clipboard.writeText($refs.cli.textContent).then(()=>{copied=true; setTimeout(()=>copied=false, 1200)})"
              class="inline-flex items-center gap-1 rounded-md border border-slate-300 dark:border-slate-700 px-2.5 py-1 text-xs hover:bg-slate-50 dark:hover:bg-slate-800">
        <template x-if="!copied">
          <span class="inline-flex items-center gap-1">{{ icon('copy', 12) }} Copy CLI</span>
        </template>
        <template x-if="copied">
          <span class="inline-flex items-center gap-1 text-emerald-600 dark:text-emerald-400">{{ icon('check', 12) }} copied</span>
        </template>
      </button>
      <span x-ref="cli" class="hidden">{{ s.cli }}</span>
      <button hx-get="/config/section/{{ s.name }}/edit" hx-target="#section-list" hx-swap="innerHTML"
              class="inline-flex items-center gap-1 rounded-md border border-slate-300 dark:border-slate-700 px-2.5 py-1 text-xs hover:bg-slate-50 dark:hover:bg-slate-800">{{ icon('pencil', 12) }} Edit</button>
      <button hx-post="/config/section/{{ s.name }}/delete" hx-target="#section-list" hx-swap="innerHTML"
              hx-confirm="Delete section [{{ s.name }}] from models.ini? The GGUF file itself is not touched."
              class="inline-flex items-center gap-1 rounded-md border border-slate-300 dark:border-slate-700 px-2.5 py-1 text-xs text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40">{{ icon('trash-2', 12) }} Delete</button>
    </div>
  </div>
</div>
