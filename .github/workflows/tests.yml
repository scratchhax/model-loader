# The two gates AGENTS.md asks for before every PR, run on every PR and every push to main:
# pytest, and pyflakes with no undefined names (unused imports and locals are tolerated, see
# AGENTS.md). Tests need no docker and no network, so a plain runner is enough.
name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pyflakes (no undefined names)
        run: |
          python -m pyflakes app tests > pyflakes.txt || true
          grep -v "imported but unused" pyflakes.txt || true
          if grep -E "undefined name|undefined local" pyflakes.txt; then exit 1; fi
      - name: pytest
        run: python -m pytest -q -p no:cacheprovider
